<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字工作台</title><style>body{margin:0;background:#20252a;color:#f3ecdf;font:20px system-ui;padding:50px}h1{font-size:38px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:45px}button{border:0;border-radius:18px;padding:35px 10px;background:#71815f;color:white;font:inherit;cursor:pointer}button:nth-child(2n){background:#ad7951}#detail{margin-top:32px;padding:24px;background:#ffffff10;border-radius:15px}</style><h1>数字工作台</h1><p>从一张照片，走进一个空间。</p><main><button>空间模型</button><button>灵感图卡</button><button>学习笔记</button><button>影像画廊</button><button>项目资料</button><button>关于房间</button></main><section id="detail" aria-live="polite">点击卡片查看内容</section><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.querySelector('#detail').textContent=b.textContent+'：可在此添加自己的内容。')</script></html>
